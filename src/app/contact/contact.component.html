<div class="container">
    <h1>Formulario template-driven</h1>
    <form #miFormulario="ngForm" (ngSubmit)="enviar1()">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="usuario.nombre" required
                [ngModelOptions]="{standalone: true}">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="usuario.email" required
                [ngModelOptions]="{standalone: true}">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<div class="container">
    <h1>Formulario reactivo</h1>
    <form [formGroup]="formularioContacto" (ngSubmit)="enviar2()">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input [ngClass]="{'is-invalid': hasErrors('nombre', 'required') || hasErrors('nombre', 'minlength')}"
            type="text" class="form-control" id="name" formControlName="nombre">
            <div class="text-danger" *ngIf="hasErrors('nombre', 'required')">Nombre requerido.</div>
            <div class="text-danger" *ngIf="hasErrors('nombre', 'minlength')">Minimo 2 caracteres.</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input [ngClass]="{'is-invalid': hasErrors('email', 'required') || hasErrors('email', 'email')}"
            type="email" class="form-control" id="email" formControlName="email">
            <div class="text-danger" *ngIf="hasErrors('email', 'email')">Email invalido.</div>
            <div class="text-danger" *ngIf="hasErrors('email', 'required')">Email requerido.</div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
